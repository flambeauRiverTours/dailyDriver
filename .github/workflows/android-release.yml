name: Android Release

# Cuts a GitHub Release with an installable, signed APK attached.
#
# Triggered by pushing a tag, so releases are deliberate acts with a permanent record rather than a
# by-product of every merge. Once the launcher is your actual home screen (T017), "which build is
# on my phone" needs an answer, and a tag is that answer.
#
# **`android-v*`, not `v*`.** This is a monorepo with three shippable things in it: the launcher,
# the WPF desktop client (§5) and the Functions backend (§6). A bare `v*` would mean the desktop
# client could never be versioned independently — tagging `v0.2.0` for a desktop release would
# build and publish an Android APK. Prefixing the component keeps their version numbers unrelated,
# which they should be: they ship separately and there is no reason a launcher release and a
# desktop release should ever have to agree on a number.
#
#   git tag android-v0.1.0 && git push origin android-v0.1.0
#
# `desktop-v*` and `backend-v*` are the obvious siblings when those exist.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. android-v0.1.0 (must already exist)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Tests run again here rather than trusting that the branch was green. A tag can be placed on
      # any commit, including one that never went through a pull request.
      - name: Unit tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
        working-directory: android

      # The keystore is stored base64-encoded because a secret is a string, and a JKS is binary.
      # Written outside the workspace so it cannot be picked up by a build script or an artifact
      # upload glob, and removed in an always() step below.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. See docs/releasing.md — without it" \
                 "the APK would be unsigned and could not be installed."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
        working-directory: android

      # Verifies what is about to be published is actually signed. Without this, a misconfigured
      # secret produces `app-release-unsigned.apk`, the upload glob quietly matches nothing or the
      # wrong file, and the failure surfaces as "app not installed" on the phone.
      - name: Verify the APK is signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::$APK missing — the build produced an unsigned APK, so signing did not apply."
            ls -la android/app/build/outputs/apk/release/
            exit 1
          fi
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          body: |
            Install by downloading the APK below on the device.

            The repository is private, so the download needs a signed-in GitHub session on the
            phone. Every release is signed with the same key, so this installs over a previous
            build without uninstalling first, and the launcher keeps its database.

      # always(), so a failed build does not leave the keystore on the runner.
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
