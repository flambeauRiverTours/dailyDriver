name: Docs

# Builds the MkDocs site and publishes it to GitHub Pages.
#
# Only runs when something the site is actually made of changes. Note the path is `website/`, not
# `docs/`: the site is built from the employer-facing pages in `website/`, while `docs/` holds the
# internal engineering documents the site links out to but never renders. Editing the design doc
# therefore does not rebuild the site, which is correct.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Superseded runs are cancelled rather than queued: only the newest commit's site matters.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - run: pip install -r docs-requirements.txt

      # --strict turns MkDocs' warnings into failures, which is the point of running this on pull
      # requests at all: a broken internal link or a page missing from the nav fails here rather
      # than shipping a 404 to the site.
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing is a separate job so pull requests get the build check without deploying —
  # a PR from a fork must never be able to publish to the live site.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
