name: Docs

# Builds the MkDocs site. **Publishing is disabled** — see the `deploy` job at the bottom (T189).
#
# Only runs when something the site is actually made of changes. Note the path is `website/`, not
# `docs/`: the site is built from the employer-facing pages in `website/`, while `docs/` holds the
# internal engineering documents the site links out to but never renders. Editing the design doc
# therefore does not rebuild the site, which is correct.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Superseded runs are cancelled rather than queued: only the newest commit's site matters.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - run: pip install -r docs-requirements.txt

      # --strict turns MkDocs' warnings into failures, which is the point of running this on pull
      # requests at all: a broken internal link or a page missing from the nav fails here rather
      # than shipping a 404 to the site.
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing is a separate job so pull requests get the build check without deploying —
  # a PR from a fork must never be able to publish to the live site.
  #
  # ⚠ Was DISABLED 2026-09-22 (T189) and is live again as of 2026-10-15.
  #
  # T189 turned this off because Pages could not be enabled: it needs a paid plan on a private
  # repository, and going public was blocked by the T014 command-log export still being reachable
  # in history. The job had been failing on every push to `main` since 2026-09-14 with
  # `Failed to create deployment (status: 404) ... Ensure GitHub Pages has been enabled`, while
  # passing on every branch, because a branch only ever runs `build`.
  #
  # Both halves of that are now resolved. The export was purged from history, and because the old
  # commit stayed reachable through 17 merged pull requests' `refs/pull/N/head` — which GitHub
  # keeps permanently and a force-push does not touch — the clean history was republished to a new
  # repository rather than this one being flipped public. Pages is enabled there and serves under
  # the account's custom domain.
  #
  # What T189 got right and is worth keeping: it disabled only *publishing*, not the workflow.
  # `mkdocs build --strict` above kept turning a broken internal link or a page missing from the
  # nav into a failed check the whole time, so `website/` stayed verifiable while nothing served
  # it. Disabling the workflow outright would have thrown that away for a month.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
