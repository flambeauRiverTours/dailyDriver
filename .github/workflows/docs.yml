name: Docs

# Builds the MkDocs site. **Publishing is disabled** — see the `deploy` job at the bottom (T189).
#
# Only runs when something the site is actually made of changes. Note the path is `website/`, not
# `docs/`: the site is built from the employer-facing pages in `website/`, while `docs/` holds the
# internal engineering documents the site links out to but never renders. Editing the design doc
# therefore does not rebuild the site, which is correct.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # Superseded runs are cancelled rather than queued: only the newest commit's site matters.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - run: pip install -r docs-requirements.txt

      # --strict turns MkDocs' warnings into failures, which is the point of running this on pull
      # requests at all: a broken internal link or a page missing from the nav fails here rather
      # than shipping a 404 to the site.
      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing is a separate job so pull requests get the build check without deploying —
  # a PR from a fork must never be able to publish to the live site.
  #
  # ⚠ DISABLED 2026-09-22 (T189). GitHub Pages is not enabled on this repository and cannot
  # simply be switched on: Pages for a private repo needs a paid plan, and making the repo public
  # is not on the table (the T014 command-log export is still reachable in history at 2553b0c).
  # This job had been failing on every push to `main` since at least 2026-09-14 with
  # `Failed to create deployment (status: 404) ... Ensure GitHub Pages has been enabled`, while
  # passing on every branch — because a branch only ever runs `build`.
  #
  # **The half that was catching anything still runs.** `mkdocs build --strict` above turns a
  # broken internal link or a page missing from the nav into a failed check, on pull requests and
  # on main alike. Only publishing is off, so `website/` stays verifiable even while nothing
  # serves it. Disabling the whole workflow would have thrown that away too.
  #
  # Re-enable by turning Pages on in repo settings and restoring the original condition:
  #   if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
  deploy:
    if: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
